name: CI/CD Pipeline
on:
  push:
    branches: [ "homework6"]
  pull_request:
    branches: [ "homework6"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Checks and Tests
        run: ./gradlew check

      - name: Build Project JAR
        run: ./gradlew jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: user-form-processor-artifact
          path: build/libs/*.jar
          retention-days: 7
